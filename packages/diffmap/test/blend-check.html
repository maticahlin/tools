<title>Blend Engine Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One row per technique: the technique drawn over a white|red backdrop, and below it what it should look like. */
  :root { --bg: #000; --fg: #fff; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { color: var(--fg); font: 13px/1.4 Arial, Helvetica, sans-serif; margin: 0;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
  h1, p { margin: 0; font-size: 13px; }
  h1 { font-weight: 700; }
  .info { border: 1px solid var(--fg); padding: 10px 12px; display: grid; gap: 4px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .cell { border: 1px solid var(--fg); padding: 8px; display: grid; gap: 6px; }
  .cell b { font-weight: 700; }
  .test, .want { display: grid; grid-template-columns: 1fr 1fr; height: 44px; position: relative; }
  .want { height: 22px; }
  .test > span, .want > span { display: block; }
  .ov { position: absolute; left: 12px; top: 8px; width: calc(100% - 24px); height: 28px; }
  .lab { font-style: italic; }
</style>

<div class="info" id="info"></div>
<div class="grid" id="grid"></div>

<script type="module">
  import { resolvePalette, layersAt, kindOf, activeLayers, AFFINE, CLAMPED, cssColor, detectSpace, srgbToP3, p3ToSrgb } from './src/core.js';

  const RED = '#ff1408';
  const info = document.getElementById('info');
  info.innerHTML = `<h1>Blend Engine Check</h1>
    <p>${navigator.userAgent}</p>
    <p>color-gamut p3: <b>${matchMedia('(color-gamut: p3)').matches}</b> · devicePixelRatio: <b>${devicePixelRatio}</b> · diffmap auto space: <b>${detectSpace()}</b></p>
    <p class="lab">In each box the top strip is the technique, the bottom strip is what it should look like. A box works when the inner rectangle of the top strip matches the bottom strip.</p>`;

  const swap = { srgb: resolvePalette({ mode: 'swap', colors: [RED, '#ffffff'] }, { space: 'srgb' }),
                 p3: resolvePalette({ mode: 'swap', colors: [RED, '#ffffff'] }, { space: 'display-p3' }) };

  const cells = [];
  function cell(n, title, build, want) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = `<p><b>${n}.</b> ${title}</p>
      <div class="test"><span style="background:#fff"></span><span style="background:${RED}"></span></div>
      <div class="want"><span style="background:${want[0]}"></span><span style="background:${want[1]}"></span></div>`;
    document.getElementById('grid').append(c);
    const host = c.querySelector('.test');
    build(host);
    cells.push(c);
  }
  // one overlay element per layer, all on the same box
  function stack(host, layers, decorate = () => {}) {
    layers.forEach(({ blend, color }, i) => {
      const el = document.createElement('div');
      el.className = 'ov';
      el.style.mixBlendMode = blend;
      el.style.background = color;
      decorate(el, i, color);
      host.append(el);
    });
  }
  const classic = [{ blend: 'difference', color: '#ffffff' }];
  const swapWant = [RED, '#ffffff'];
  const classicWant = ['#000000', '#00ebf7'];

  // --- positioning, one white difference layer
  cell(1, 'difference, absolute', (h) => stack(h, classic), classicWant);
  cell(2, 'difference, absolute + translate()', (h) => stack(h, classic, (el) => { el.style.transform = 'translate(0px, 0px)'; }), classicWant);
  cell(3, 'difference, absolute + translate3d()', (h) => stack(h, classic, (el) => { el.style.transform = 'translate3d(0px, 0px, 0)'; }), classicWant);
  cell(4, 'difference, will-change: transform', (h) => stack(h, classic, (el) => { el.style.willChange = 'transform'; }), classicWant);
  cell(5, 'difference, position: fixed', (h) => stack(h, classic, (el) => { el.style.position = 'fixed'; el.dataset.fixed = ''; }), classicWant);

  // --- the 5-layer swap stack, different ways of painting the same colors
  const S = swap.srgb.layers, P = swap.p3.layers;
  cell(6, `swap stack (${S.length} layers), solid sRGB colors`, (h) => stack(h, S), swapWant);
  cell(7, `swap stack, solid color(display-p3), P3 math`, (h) => stack(h, P), swapWant);
  cell(8, 'swap stack, sRGB linear-gradient backgrounds', (h) => stack(h, S, (el, i, c) => { el.style.background = `linear-gradient(${c}, ${c})`; }), swapWant);
  cell(9, 'swap stack, display-p3 gradients (in display-p3)', (h) => stack(h, P, (el, i, c) => { el.style.background = `linear-gradient(in display-p3, ${c}, ${c})`; }), swapWant);

  const png = (color, space) => {
    const c = document.createElement('canvas'); c.width = 8; c.height = 8;
    const x = c.getContext('2d', space === 'srgb' ? undefined : { colorSpace: space });
    x.fillStyle = color; x.fillRect(0, 0, 8, 8);
    return c.toDataURL();
  };
  cell(10, 'swap stack, PNG background-image (sRGB canvas)', (h) => stack(h, S, (el, i, c) => { el.style.background = `url("${png(c, 'srgb')}") 0 0 / 100% 100%`; }), swapWant);
  cell(11, 'swap stack, PNG background-image (P3 canvas, P3 math)', (h) => stack(h, P, (el, i, c) => { el.style.background = `url("${png(c, 'display-p3')}") 0 0 / 100% 100%`; }), swapWant);
  const withCanvas = (space) => (el, i, c) => {
    el.style.background = 'transparent';
    const cv = document.createElement('canvas'); cv.width = 8; cv.height = 8;
    cv.style.cssText = 'display:block;width:100%;height:100%';
    const x = cv.getContext('2d', space === 'srgb' ? undefined : { colorSpace: space });
    x.fillStyle = c; x.fillRect(0, 0, 8, 8);
    el.append(cv);
  };
  cell(12, 'swap stack, &lt;canvas&gt; inside each layer (sRGB)', (h) => stack(h, S, withCanvas('srgb')), swapWant);
  cell(13, 'swap stack, &lt;canvas&gt; inside each layer (P3)', (h) => stack(h, P, withCanvas('display-p3')), swapWant);
  const mask = `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10"/></svg>')}") 0 0 / 100% 100%`;
  cell(14, 'swap stack, solid sRGB + mask-image', (h) => stack(h, S, (el) => { el.style.mask = mask; el.style.webkitMask = mask; }), swapWant);
  cell(15, 'swap stack, solid P3 + mask-image', (h) => stack(h, P, (el) => { el.style.mask = mask; el.style.webkitMask = mask; }), swapWant);

  // --- single blend modes the clamped stack relies on
  const one = (blend, color) => [{ blend, color }];
  const exp = (fn) => ['#ffffff', RED].map((b) => {
    const v = [b.slice(1, 3), b.slice(3, 5), b.slice(5, 7)].map((x) => parseInt(x, 16) / 255);
    return '#' + fn(v).map((x) => Math.round(Math.min(1, Math.max(0, x)) * 255).toString(16).padStart(2, '0')).join('');
  });
  cell(16, 'lighten #808080', (h) => stack(h, one('lighten', '#808080')), exp((v) => v.map((x) => Math.max(x, 128 / 255))));
  cell(17, 'darken #808080', (h) => stack(h, one('darken', '#808080')), exp((v) => v.map((x) => Math.min(x, 128 / 255))));
  cell(18, 'multiply #808080', (h) => stack(h, one('multiply', '#808080')), exp((v) => v.map((x) => x * 128 / 255)));
  cell(19, 'color-dodge #808080', (h) => stack(h, one('color-dodge', '#808080')), exp((v) => v.map((x) => (x === 0 ? 0 : Math.min(1, x / (1 - 128 / 255))))));
  cell(20, 'color #808080 (duotone)', (h) => stack(h, one('color', '#808080')), exp((v) => { const l = 0.3 * v[0] + 0.59 * v[1] + 0.11 * v[2]; return [l, l, l]; }));

  // --- diffmap's own two positioning strategies, with the P3 swap stack
  cell(21, 'swap stack (P3) in a fixed layer, translate3d', (h) => stack(h, P, (el) => { el.style.position = 'fixed'; el.style.transform = 'translate3d(0,0,0)'; el.style.willChange = 'transform'; el.dataset.fixed = ''; }), swapWant);
  cell(22, 'swap stack (P3) inside an absolute overflow:clip box', (h) => {
    const box = document.createElement('div');
    box.style.cssText = 'position:absolute;inset:0;overflow:clip;pointer-events:none';
    h.append(box);
    stack(box, P, (el) => { el.style.transform = 'translate(0px,0px)'; el.style.zIndex = '2147483000'; });
  }, swapWant);

  // fixed layers follow their box
  const placeFixed = () => document.querySelectorAll('[data-fixed]').forEach((el) => {
    const r = el.parentElement.getBoundingClientRect();
    el.style.left = r.left + 12 + 'px'; el.style.top = r.top + 8 + 'px'; el.style.width = r.width - 24 + 'px';
  });
  placeFixed();
  addEventListener('scroll', placeFixed, { passive: true });
  addEventListener('resize', placeFixed);
</script>
